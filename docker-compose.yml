services:
  mysql:
    image: mysql:8.0
    container_name: tarzi-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tarzi_signage
      MYSQL_USER: tarzi
      MYSQL_PASSWORD: Tarzi_Signage_2026!
    volumes:
      - tarzi_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tarzi_mysql_data:
